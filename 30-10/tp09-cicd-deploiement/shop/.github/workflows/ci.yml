name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          recursive: true

      - name: docker compose config
        run: |
          mkdir -p secrets && echo ci > secrets/db_password.txt
          docker compose config --quiet
          REGISTRY=ghcr.io/ci VERSION=ci docker compose -f compose.yml -f compose.prod.yml config --quiet

  build:
    needs: lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write   # signature keyless cosign
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: apps/shopapi
            image: shopapi
          - name: worker
            context: apps/shop-worker
            image: shop-worker
    steps:
      - uses: actions/checkout@v4

      # ghcr veut un nom en minuscules
      - name: prefixe image
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}" >> "$GITHUB_ENV"

      # pip.conf du registre interne (secret github), pypi public sinon
      - name: pip.conf
        env:
          PIP_INDEX_URL: ${{ secrets.PIP_INDEX_URL }}
        run: printf '[global]\nindex-url = %s\n' "${PIP_INDEX_URL:-https://pypi.org/simple}" > "$RUNNER_TEMP/pip.conf"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=ref,event=pr
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.vendor=Shop SAS

      - name: tests (stage test)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: test
          secret-files: pipconf=${{ runner.temp }}/pip.conf
          cache-from: type=gha,scope=${{ matrix.name }}
          outputs: type=cacheonly

      - name: login ghcr
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build (+ push hors PR)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
          secret-files: pipconf=${{ runner.temp }}/pip.conf
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
          provenance: mode=max
          sbom: true

      - name: scan trivy (bloquant)
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          scanners: vuln,secret
          exit-code: "1"

      - uses: sigstore/cosign-installer@v3.6.0
        if: github.event_name != 'pull_request'

      # pas de cle : certificat ephemere fulcio lie a l'identite du workflow (OIDC github)
      - name: signature keyless
        if: github.event_name != 'pull_request'
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"

  deploy-preprod:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    environment: preprod
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@v3.6.0
      - name: deploiement
        uses: ./.github/actions/deploy
        with:
          version: sha-${{ github.sha }}
          ssh-host: ${{ vars.DEPLOY_HOST }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

  deploy-prod:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    # approbation manuelle : "required reviewers" configures sur l'environment production
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@v3.6.0
      - name: deploiement
        uses: ./.github/actions/deploy
        with:
          version: ${{ github.ref_name }}
          ssh-host: ${{ vars.DEPLOY_HOST }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
