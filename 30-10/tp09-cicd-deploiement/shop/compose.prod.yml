# docker compose -f compose.yml -f compose.prod.yml up -d --wait
x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true

services:
  traefik:
    <<: *hardening
    cap_add: [NET_BIND_SERVICE]
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M

  api:
    <<: *hardening
    build: !reset null
    image: ${REGISTRY:?REGISTRY doit etre defini}/shopapi:${VERSION:?VERSION doit etre defini}
    tmpfs:
      - /tmp
    environment:
      LOG_LEVEL: info
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          memory: 128M

  worker:
    <<: *hardening
    build: !reset null
    image: ${REGISTRY:?REGISTRY doit etre defini}/shop-worker:${VERSION:?VERSION doit etre defini}
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  # l'entrypoint postgres/redis fait des chown puis passe en user non root avec gosu/su-exec
  db:
    <<: *hardening
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    tmpfs:
      - /var/run/postgresql
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  redis:
    <<: *hardening
    cap_add: [CHOWN, SETGID, SETUID]
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
