ServerName geststock
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<VirtualHost *:8080>
    DocumentRoot /var/www/geststock/public

    <Directory /var/www/geststock/public>
        Options -Indexes
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
    </Directory>

    # photos uploadees (volume), comme l'alias du serveur legacy
    Alias /uploads /var/www/uploads
    <Directory /var/www/uploads>
        Options -Indexes
        AllowOverride None
        Require all granted
        # jamais de php execute depuis les uploads
        php_admin_flag engine off
        <FilesMatch "\.(?i:php|phtml|phar)$">
            Require all denied
        </FilesMatch>
    </Directory>

    # pas de log d'acces pour le healthcheck
    SetEnvIf Query_String "^health$" is_health
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined env=!is_health
</VirtualHost>
