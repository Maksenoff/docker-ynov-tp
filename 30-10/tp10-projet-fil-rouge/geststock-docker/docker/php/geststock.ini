; config php de prod (charge apres php.ini-production)
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

memory_limit = 128M
max_execution_time = 30
upload_max_filesize = 20M
post_max_size = 25M
max_file_uploads = 5
upload_tmp_dir = /tmp

date.timezone = ${TZ}

session.cookie_httponly = 1
session.use_strict_mode = 1

; mail() passe par msmtp vers le relais smtp (mailpit en dev)
sendmail_path = "/usr/bin/msmtp -t --host=${SMTP_HOST} --port=${SMTP_PORT} --from=${MAIL_FROM} --tls=${SMTP_TLS} --auth=off"

opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
