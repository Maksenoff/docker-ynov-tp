# sidecar de sauvegarde planifiee pour la stack du TP04
# docker compose -f ../tp04-compose-entreprise/compose.yml -f compose.backup.yml up -d --wait
services:
  backup:
    image: prodrigestivill/postgres-backup-local:16
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      SCHEDULE: "@every 1m"
      BACKUP_KEEP_DAYS: "7"
      BACKUP_KEEP_WEEKS: "4"
      BACKUP_KEEP_MONTHS: "6"
    secrets:
      - db_password
    volumes:
      - backups:/backups
    networks:
      - back
    depends_on:
      db:
        condition: service_healthy

volumes:
  backups:
